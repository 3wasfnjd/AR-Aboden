; Meta Quest 3 / 3S test build (adapted from the Dahrooj Quest preset: arm64 only, gradle build,
; OpenXR + Meta plugin, passthrough, hand/eye/face/body tracking off, Quest 3 only, no extra permissions).
; boundary_mode=1 ("Disabled"): boundaryless MR app -> com.oculus.feature.BOUNDARYLESS_APP in the manifest.
; version/code is set from the CI run number by tools/ci/build_apk.sh.
[preset.0]

name="Quest"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, shots/*, android/*"
export_path="../build/table-war-test.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk="34"
gradle_build/custom_theme_attributes={}
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="com.abodengames.tablewar"
package/name="Table War (test)"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
launcher_icons/adaptive_monochrome_432x432=""
graphics/opengl_debug=false
shader_baker/enabled=false
xr_features/xr_mode=1
gesture/swipe_to_dismiss=false
screen/immersive_mode=true
screen/edge_to_edge=false
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
screen/background_color=Color(0, 0, 0, 1)
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
permissions/custom_permissions=PackedStringArray()
permissions/internet=false
xr_features/enable_khronos_plugin=false
xr_features/enable_lynx_plugin=false
xr_features/enable_androidxr_plugin=false
xr_features/enable_magicleap_plugin=false
xr_features/enable_pico_plugin=false
xr_features/enable_meta_plugin=true
meta_xr_features/eye_tracking=0
meta_xr_features/face_tracking=0
meta_xr_features/body_tracking=0
meta_xr_features/hand_tracking=0
meta_xr_features/hand_tracking_frequency=0
meta_xr_features/passthrough=1
meta_xr_features/render_model=1
meta_xr_features/use_overlay_keyboard=false
meta_xr_features/use_experimental_features=false
meta_xr_features/boundary_mode=1
meta_xr_features/instant_splash_screen=false
meta_xr_features/quest_1_support=false
meta_xr_features/quest_2_support=false
meta_xr_features/quest_3_support=true
meta_xr_features/quest_pro_support=false

; Web free-play build (build 19): single-threaded (no cross-origin isolation headers
; needed, so it runs from GitHub Pages), Compatibility renderer, no XR addons.
[preset.1]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features="web_free_play"
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, shots/*, android/*, addons/godotopenxrvendors/*, addons/godot_meta_toolkit/*"
export_path="../build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>body{background:#0a2a5c}#status{background:#0a2a5c!important}#status-splash{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center 35%}@media (orientation:landscape){#status-splash{object-fit:contain!important}}#status-progress{bottom:7%!important;width:60%!important;height:10px;accent-color:#e2b65c}</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
