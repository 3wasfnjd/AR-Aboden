<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#090b14">
  <title>تركيب صورة AR 3D — عبودين</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
    body{display:grid;place-items:end center;min-height:100dvh;background:
      radial-gradient(circle at 50% 24%,rgba(119,95,220,.24),transparent 35%),
      linear-gradient(180deg,#0d1120,#05070c 68%)}
    .top{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center}
    a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);border-radius:999px;padding:9px 12px;font-size:12px;font-weight:900}
    .tag{font-size:11px;color:#aeb8c5}
    .panel{width:min(520px,calc(100% - 28px));margin-bottom:max(22px,env(safe-area-inset-bottom));border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.06);border-radius:28px;padding:24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
    .icon{width:78px;height:78px;border-radius:24px;display:grid;place-items:center;margin:0 auto 18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);font-size:34px}
    h1{margin:0 0 10px;text-align:center;font-size:28px}
    p{margin:0;color:#c5ced9;text-align:center;line-height:1.8;font-size:14px}
    .note{margin-top:16px;padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.2);color:#aab4c0;font-size:12px;line-height:1.7}
  </style>
</head>
<body>
  <div class="top">
    <a href="./photo.html">← اختيار النمط</a>
    <div class="tag">PHOTO AR · 3D</div>
  </div>

  <section class="panel">
    <div class="icon">◫</div>
    <h1>مسار 3D مستقل</h1>
    <p>هذا المسار مخصص للنسخة التي ستثبت الصورة على سطح حقيقي وتبقيها في مكانها عند تحريك الجوال.</p>
    <div class="note">النسخة العادية بقيت في <b>photo-ar.html</b> بدون أي تغيير. سنبني التتبع ثلاثي الأبعاد هنا فقط.</div>
  </section>
</body>
</html>
