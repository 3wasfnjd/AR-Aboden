<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>علامة HIRO — AR Aboden</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:#f4f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:24px}
    .card{width:min(92vw,620px);background:#fff;border-radius:28px;padding:26px;box-shadow:0 22px 70px rgba(0,0,0,.12);text-align:center}
    h1{margin:0 0 8px;font-size:26px}.sub{margin:0 0 20px;color:#667085;line-height:1.7}
    img{display:block;width:min(78vw,440px);margin:0 auto;background:#fff;border:14px solid #fff}
    .note{margin:18px 0 0;font-size:14px;line-height:1.8;color:#475467}
    .back{display:inline-block;margin-top:18px;text-decoration:none;background:#111827;color:#fff;padding:13px 18px;border-radius:16px;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <h1>علامة HIRO</h1>
    <p class="sub">اعرض هذه العلامة على شاشة ثانية أو اطبعها، ثم وجّه كاميرا الجوال إليها من صفحة التجربة.</p>
    <img src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" alt="AR.js Hiro marker">
    <p class="note">خلّ العلامة كاملة داخل الكاميرا مع إضاءة جيدة. كلما كانت أكبر وأوضح كان التتبع أفضل.</p>
    <a class="back" href="./">العودة للتجربة</a>
  </main>
</body>
</html>
